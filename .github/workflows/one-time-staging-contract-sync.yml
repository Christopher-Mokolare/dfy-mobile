name: One-time sync staging backend API contract

on:
  push:
    branches:
      - feat/didit-identity-verification
    paths:
      - .github/workflows/one-time-staging-contract-sync.yml

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch canonical DFY-BE staging contract
        env:
          DFY_BE_READ_TOKEN: ${{ secrets.DFY_BE_READ_TOKEN }}
        run: |
          test -n "$DFY_BE_READ_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DFY_BE_READ_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/DoForYou-ZA/DFY-BE/contents/docs/openapi.json?ref=staging" \
            -o /tmp/dfy-staging-openapi.json
          python -m json.tool /tmp/dfy-staging-openapi.json >/dev/null
      - name: Regenerate mobile API declarations
        run: |
          cp /tmp/dfy-staging-openapi.json contracts/openapi.json
          npx --yes openapi-typescript@7.6.1 contracts/openapi.json -o src/api/openapi.d.ts
      - name: Commit contract sync and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-staging-contract-sync.yml
          git add contracts/openapi.json src/api/openapi.d.ts
          git commit -m "chore: sync mobile API contract with DFY-BE staging"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
