name: Mobile CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, align/dfy-fe-be-contract]
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck-and-bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Verify live staging task budget endpoint
        env:
          DFY_API_URL: https://dfy-be-staging.onrender.com/api/v1
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$DFY_API_URL/config/task-limits")"
          echo "$response" | jq -e '.success == true and .data.minimumBudget == 50 and .data.maximumBudget == 100000 and .data.currency == "ZAR"' >/dev/null

      - name: Smoke test live staging authentication endpoint
        env:
          DFY_API_URL: https://dfy-be-staging.onrender.com/api/v1
        run: |
          email="dfy-staging-ci-${GITHUB_RUN_ID}@example.invalid"
          code="$(curl --silent --show-error --output /tmp/dfy-auth-smoke.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$email\",\"password\":\"DfyStagingSmokePassword123!\"}" \
            "$DFY_API_URL/auth/login")"
          if [ "$code" != "401" ]; then
            cat /tmp/dfy-auth-smoke.json
            echo "Expected unknown staging account to return HTTP 401, received $code"
            exit 1
          fi

      - name: Generate canonical OpenAPI declarations for CI artifact
        run: npx --yes openapi-typescript@7.6.1 contracts/openapi.json -o /tmp/dfy-openapi.d.ts
      - name: Upload generated OpenAPI declarations for contract sync
        uses: actions/upload-artifact@v6
        with:
          name: dfy-openapi-generated
          path: /tmp/dfy-openapi.d.ts
          if-no-files-found: error

      - name: Commit regenerated OpenAPI declarations to PR branch
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$PR_HEAD_REF"
          git checkout "$PR_HEAD_REF"
          cp /tmp/dfy-openapi.d.ts src/api/openapi.d.ts
          if ! git diff --quiet -- src/api/openapi.d.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/api/openapi.d.ts
            git commit -m "chore(api): regenerate OpenAPI declarations from BE staging"
            git push origin "HEAD:refs/heads/$PR_HEAD_REF"
          fi

      - name: Verify generated OpenAPI declarations
        run: |
          npx --yes openapi-typescript@7.6.1 contracts/openapi.json -o /tmp/dfy-openapi.d.ts
          diff -u src/api/openapi.d.ts /tmp/dfy-openapi.d.ts

      - name: Check freshness against canonical DFY-BE staging
        env:
          DFY_BE_READ_TOKEN: ${{ secrets.DFY_BE_READ_TOKEN }}
        run: |
          if [ -z "$DFY_BE_READ_TOKEN" ]; then
            echo "::error::DFY_BE_READ_TOKEN is required to verify this client against the canonical DFY-BE contract. Configure a read-only Contents token in repository Actions secrets."
            exit 1
          fi
          # This PR and the active DFY client contract target staging.
          # Use the staging API snapshot even when a branch-push event has no GITHUB_BASE_REF.
          CANONICAL_REF="staging"
          curl --fail --silent --show-error -H "Authorization: Bearer $DFY_BE_READ_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/DoForYou-ZA/DFY-BE/contents/docs/openapi.json?ref=$CANONICAL_REF" -o /tmp/dfy-canonical-openapi.json
          diff -u contracts/openapi.json /tmp/dfy-canonical-openapi.json

      - name: TypeScript check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Export Android JavaScript bundle
        run: |
          set -o pipefail
          npx expo export --platform android 2>&1 | tee expo-export.log
      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dfy-mobile-ci-diagnostics
          path: |
            typecheck.log
            expo-export.log
          if-no-files-found: ignore

  android-release-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    # Expo public variables are embedded in the client bundle at build time.
    # Keep these staging URLs here so the installed APK targets the staging API.
    env:
      EXPO_PUBLIC_DFY_API_URL: https://dfy-be-staging.onrender.com/api/v1
      EXPO_PUBLIC_DFY_SIGNALR_URL: https://dfy-be-staging.onrender.com
      # OAuth client IDs are public app configuration, not private secrets.
      # Set these repository Actions variables to enable Google sign-in in the APK.
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Show runner disk space before build
        run: df -h
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Configure Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v5
      - name: Install dependencies
        run: npm ci
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Limit native build to 64-bit ARM devices
        run: |
          sed -i '/^reactNativeArchitectures=/d' android/gradle.properties
          echo 'reactNativeArchitectures=arm64-v8a' >> android/gradle.properties
          grep '^reactNativeArchitectures=' android/gradle.properties
          df -h
      - name: Build standalone release APK (embeds JavaScript; no Metro required)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../android-build.log
      - name: Prepare stable APK filename
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/dfy-mobile.apk
      - name: Show runner disk space after build
        if: always()
        run: df -h
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dfy-mobile-android-build-diagnostics
          path: android-build.log
          if-no-files-found: ignore
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v6
        with:
          name: dfy-mobile-android-release
          path: android/app/build/outputs/apk/release/dfy-mobile.apk
          if-no-files-found: error
      - name: Publish direct-download staging-branch release
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-staging-branch-latest
          target_commitish: staging
          name: DoForYou Mobile — Latest staging-branch APK
          body: |
            Installable Android staging build from the staging branch.
            This APK connects to the DFY staging API and is intended for testing, not production use.
            Device-level login and task-flow smoke tests are still required.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/release/dfy-mobile.apk
      - name: Trigger DFY-FE staging deployment after staging APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.DFY_FE_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::DFY_FE_STAGING_DEPLOY_HOOK is not configured; website deployment was skipped."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Publish direct-download staging release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-staging-latest
          name: DoForYou Mobile — Latest Staging APK
          body: |
            Installable Android staging build for DoForYou Mobile.

            This build connects to the DFY staging API and is intended for testing, not production use. Device-level login and task-flow smoke tests are still required.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/release/dfy-mobile.apk
      - name: Trigger DFY-FE staging deployment to refresh bundled APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.DFY_FE_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::DFY_FE_STAGING_DEPLOY_HOOK is not configured; website deployment was skipped."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
